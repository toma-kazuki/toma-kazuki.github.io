<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recovery decision tree</title>
<style>
  :root {
    --maroon: #500000; --ink: #222; --muted: #6b6b6b; --line: #c9c9c9;
    --decision: #1f5fa8; --chance: #e0a800; --ok: #2ca02c; --bad: #d62728; --truth: #2ca02c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: #fafafa; }
  header { background: var(--maroon); color: #fff; padding: 14px 24px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  .controls { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 12px 24px; background: #fff; border-bottom: 1px solid #e3e3e3; font-size: 14px; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  select, input { font: inherit; padding: 3px 6px; }
  button { font: inherit; padding: 3px 10px; cursor: pointer; }
  .layout { display: grid; grid-template-columns: 430px 1fr; gap: 0; min-height: calc(100vh - 120px); }
  aside { padding: 14px 18px; background: #fff; border-right: 1px solid #e3e3e3; font-size: 13px; overflow: auto; }
  aside h2 { font-size: 14px; margin: 14px 0 6px; color: var(--maroon); text-transform: uppercase; letter-spacing: .04em; }
  aside h2:first-child { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 3px 5px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
  th { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.truth td:first-child { font-weight: 700; color: var(--truth); }
  tr.best td { background: #f3ece4; font-weight: 700; }
  .note { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .seq { margin: 0; padding-left: 18px; }
  .seq li.ok { color: var(--ok); font-weight: 700; }
  main { overflow: auto; padding: 10px; }
  svg text { font-size: 11.5px; fill: var(--ink); }
  svg .edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
  svg .edge.policy { stroke: var(--maroon); stroke-width: 2.6; }
  svg .lbl { fill: var(--muted); }
  svg .lbl.policy { fill: var(--maroon); font-weight: 700; }
  svg .decision { fill: var(--decision); }
  svg .chance { fill: var(--chance); cursor: pointer; }
  svg .chance.collapsed { fill: #fff; stroke: var(--chance); stroke-width: 2; }
  svg .leaf { fill: var(--ok); }
  svg .leaf.late { fill: var(--bad); }
  svg .leaf.truth { stroke: #000; stroke-width: 1.6; }
  svg .val { font-weight: 700; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; margin-top: 6px; }
  .legend span { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>Recovery-action selection as a decision tree</h1>
  <p>At each decision node the crew chooses which hypothesis' procedure(s) to work next; the chance node resolves whether that fixed the anomaly.</p>
</header>
<div class="controls">
  <label>Scenario <select id="scenario"></select></label>
  <label>Highlighted policy
    <select id="policy">
      <option value="priority">P/T (priority)</option>
      <option value="probability">Highest P first</option>
      <option value="shortest">Shortest T first</option>
      <option value="optimal">Optimal (backward induction)</option>
    </select>
  </label>
  <label>Verification window after a miss (min) <input id="window" type="number" min="0" step="0.5" style="width:64px"></label>
  <button id="expand">Expand all</button>
  <button id="collapse">Policy path only</button>
  <div class="legend">
    <span><svg width="14" height="14"><rect width="14" height="14" class="decision"/></svg>decision</span>
    <span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#e0a800"/></svg>chance (click to expand)</span>
    <span><svg width="14" height="14"><polygon points="0,0 14,7 0,14" fill="#2ca02c"/></svg>leaf: recovered</span>
    <span><svg width="14" height="14"><polygon points="0,0 14,7 0,14" fill="#d62728"/></svg>leaf: after run end</span>
    <span><svg width="14" height="14"><polygon points="1,1 13,7 1,13" fill="#2ca02c" stroke="#000" stroke-width="1.6"/></svg>true anomaly</span>
  </div>
</div>
<div class="layout">
  <aside id="side"></aside>
  <main><svg id="tree"></svg></main>
</div>

apacity", "p": 0.10080645161290323, "procedures": ["TCCS Fan Dampener Assembly Rate Change"]}, {"name": "TCCS Auxiliary Fan #1 Failure", "p": 0.13306451612903228, "procedures": ["TCCS Auxiliary Fan Swapout"]}, {"name": "TCCS Auxiliary Fan #2 Failure", "p": 0.13306451612903228, "procedures": ["TCCS Auxiliary Fan Swapout"]}, {"name": "TCCS Filter Clog", "p": 0.10080645161290323, "procedures": ["TCCS Charcoal Filter Swapout"]}, {"name": "Trace Contaminants", "p": 0.40322580645161293, "procedures": ["Excess Cabin Gases"]}], "decided_at": 41.0, "verify_window_min": 1.0, "etr": {"Fuel Cell Injector Purge": 8.0, "PDU Failure": 6.0, "TCCS Fan Dampener Assembly Rate Change": 4.0, "TCCS Auxiliary Fan Swapout": 20.0, "TCCS Charcoal Filter Swapout": 18.0, "Excess Cabin Gases": 20.0}, "truth_procedures": ["Excess Cabin Gases"]}, {"number": 29, "title": "29 - WRS Failure", "truth": "WRS Failure", "inject_at": 20.0, "horizon_min": 59.65, "sequence": ["WRS Failure"], "candidates": [{"name": "WRS Failure", "p": 1.0, "procedures": ["WRS Microbial Filter Saturation"]}], "decided_at": 37.0, "verify_window_min": 1.0, "etr": {"WRS Microbial Filter Saturation": 14.0}, "truth_procedures": ["WRS Microbial Filter Saturation"]}, {"number": 30, "title": "30 - WRS Maintenance", "truth": "WRS Maintenance", "inject_at": 20.0, "horizon_min": 59.65, "sequence": [], "candidates": [], "truth_procedures": ["WRS Maintenance"], "etr": {"WRS Maintenance": 14.0}}, {"number": 31, "title": "31 - WRS Off-nominal pH Level", "truth": "WRS Off-nominal pH Level", "inject_at": 20.0, "horizon_min": 59.65, "sequence": ["WRS Off-nominal pH Level"], "candidates": [{"name": "WRS Off-nominal pH Level", "p": 1.0, "procedures": ["Potable Water Check", "WRS Maintenance"]}], "decided_at": 30.0, "verify_window_min": 1.0, "etr": {"Potable Water Check": 5.0, "WRS Maintenance": 14.0}, "truth_procedures": ["Potable Water Check", "WRS Maintenance"]}];
const NS = "http://www.w3.org/2000/svg";
const GAP_DC = 270, GAP_CX = 130, ROW = 26, PAD = 24;
const POLICY_LABEL = { priority: "P/T (priority)", probability: "Highest P first", shortest: "Shortest T first", optimal: "Optimal" };

let sc = null, cands = [], etr = {}, W = 1, policy = "priority", toggles = {}, memo = new Map(), truthProcs = [], t0 = 0;

const fmt = (x, d = 1) => (x == null || !isFinite(x) ? "–" : x.toFixed(d));
const mass = rem => rem.reduce((s, k) => s + cands[k].p, 0);
const keyOf = S => S.rem.join(",") + "|" + [...S.done].sort().join(";");
const remT = (c, done) => cands[c].procedures.filter(p => !done.has(p)).reduce((s, p) => s + (etr[p] ?? 0), 0);
const short = (s, n = 34) => (s.length > n ? s.slice(0, n - 1) + "…" : s);

function option(S, c) {
  const done = new Set(S.done);
  cands[c].procedures.forEach(p => done.add(p));
  const covered = S.rem.filter(k => cands[k].procedures.every(p => done.has(p)));
  const pS = mass(covered) / mass(S.rem);
  const rest = S.rem.filter(k => !covered.includes(k));
  return { c, dt: remT(c, S.done), pS, covered, done, fixesTruth: fixesTruth(S.done, done), fail: rest.length && pS < 1 - 1e-12 ? { rem: rest, done } : null };
}
const fixesTruth = (before, after) =>
  truthProcs.length > 0 && truthProcs.every(p => after.has(p)) && !truthProcs.every(p => before.has(p));
const coversTruth = c => truthProcs.length > 0 && truthProcs.every(p => cands[c].procedures.includes(p));

function rankKey(S, c, pol) {
  const P = cands[c].p / mass(S.rem), T = remT(c, S.done), n = cands[c].name;
  if (pol === "probability") return [-P, T, n];
  if (pol === "shortest") return [T, -P, n];
  return [-Number((P / T).toPrecision(12)), -P, T, n];
}
const cmp = (a, b) => { for (let i = 0; i < a.length; i++) { if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; } return 0; };

function qValue(S, c) {
  const o = option(S, c);
  return o.dt + (o.fail ? (1 - o.pS) * (W + optimal(o.fail).value) : 0);
}
function optimal(S) {
  const k = keyOf(S);
  if (memo.has(k)) return memo.get(k);
  let best = { value: 0, arg: null };
  if (S.rem.length) {
    best = { value: Infinity, arg: null };
    for (const c of S.rem) {
      const q = qValue(S, c);
      if (q < best.value - 1e-9 || (Math.abs(q - best.value) <= 1e-9 && cmp(rankKey(S, c, "priority"), rankKey(S, best.arg, "priority")) < 0)) best = { value: q, arg: c };
    }
  }
  memo.set(k, best);
  return best;
}
function ranked(S, pol) {
  if (pol === "optimal") return [...S.rem].sort((a, b) => qValue(S, a) - qValue(S, b) || cmp(rankKey(S, a, "priority"), rankKey(S, b, "priority")));
  return [...S.rem].sort((a, b) => cmp(rankKey(S, a, pol), rankKey(S, b, pol)));
}
const choose = (S, pol) => ranked(S, pol)[0];

function chain(pol) {
  let S = { rem: cands.map((_, i) => i), done: new Set() }, reach = 1, t = 0, E = 0, late = 0, attempts = 0, truthAt = null;
  while (S) {
    const o = option(S, choose(S, pol));
    attempts += reach;
    const fixAt = t + o.dt;
    E += reach * o.pS * fixAt;
    if (t0 + fixAt > sc.horizon_min) late += reach * o.pS;
    if (truthAt == null && o.fixesTruth) truthAt = fixAt;
    reach *= 1 - o.pS;
    if (!o.fail) break;
    t = fixAt + W;
    S = o.fail;
  }
  return { E, late, attempts, truthAt };
}

function build(S, id, t, reach, onPolicy) {
  const order = ranked(S, policy), choice = order[0];
  const node = { type: "D", id, t, E: optimal(S).value, onPolicy, children: [] };
  for (const c of order) {
    const o = option(S, c), cid = `${id}/${c}`, isPol = onPolicy && c === choice;
    const expanded = cid in toggles ? toggles[cid] : isPol;
    const ch = { type: "C", id: cid, c, o, q: qValue(S, c), onPolicy: isPol, expanded, children: [] };
    if (expanded) {
      ch.children.push({ type: "L", id: cid + "/s", t: t + o.dt, p: reach * o.pS, pS: o.pS, truth: o.fixesTruth, onPolicy: isPol, edge: "s" });
      if (o.fail) {
        const d = build(o.fail, cid + "/f", t + o.dt + W, reach * (1 - o.pS), isPol);
        d.edge = "f"; d.pF = 1 - o.pS;
        ch.children.push(d);
      }
    }
    node.children.push(ch);
  }
  return node;
}

function layout(node, depth, x, rows) {
  node.depth = depth; node.x = x;
  const kids = node.children || [];
  if (!kids.length) { node.y = rows.n++ * ROW; return; }
  kids.forEach(k => layout(k, depth + 1, x + (node.type === "D" ? GAP_DC : GAP_CX), rows));
  node.y = (kids[0].y + kids[kids.length - 1].y) / 2;
}

function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}

function draw(root) {
  const svg = document.getElementById("tree");
  svg.innerHTML = "";
  const g = el("g", { transform: `translate(${PAD + 36},${PAD + 14})` }, svg);
  let maxX = 0, maxY = 0;
  const visit = (n, parent) => {
    maxX = Math.max(maxX, n.x); maxY = Math.max(maxY, n.y);
    if (parent) {
      const pol = n.onPolicy ? " policy" : "";
      const mx = parent.x + (n.x - parent.x) * (parent.type === "D" ? 0.18 : 0.35);
      el("path", { d: `M${parent.x},${parent.y} H${mx} V${n.y} H${n.x}`, class: "edge" + pol }, g);
      let label = "";
      if (n.type === "C") label = `${short(cands[n.c].name)} · ${fmt(n.o.dt, 0)} min`;
      else if (n.edge === "s") label = `fixed ${fmt(n.pS, 2)}`;
      else if (n.edge === "f") label = `not fixed ${fmt(n.pF, 2)}`;
      const t = el("text", { x: n.x - 9, y: n.y - 5, "text-anchor": "end", class: "lbl" + pol }, g, label);
      if (n.type === "C") el("title", {}, t, `${cands[n.c].name}\nprocedures: ${cands[n.c].procedures.join(" → ")}`);
    }
    if (n.type === "D") {
      el("rect", { x: n.x - 7, y: n.y - 7, width: 14, height: 14, class: "decision" }, g);
      el("text", { x: n.x, y: n.y + 20, "text-anchor": "middle", class: "val" }, g, `E* ${fmt(n.E)} min`);
    } else if (n.type === "C") {
      const c = el("circle", { cx: n.x, cy: n.y, r: 7, class: "chance" + (n.expanded ? "" : " collapsed") }, g);
      c.addEventListener("click", () => { toggles[n.id] = !n.expanded; render(); });
      if (!n.expanded) el("text", { x: n.x + 12, y: n.y + 4, class: "lbl" }, g, `Q ${fmt(n.q)} min ▸`);
    } else {
      const late = t0 + n.t > sc.horizon_min;
      el("polygon", { points: `${n.x - 6},${n.y - 7} ${n.x + 8},${n.y} ${n.x - 6},${n.y + 7}`, class: "leaf" + (late ? " late" : "") + (n.truth ? " truth" : "") }, g);
      el("text", { x: n.x + 13, y: n.y + 4, class: n.truth ? "val" : "" }, g,
        `${fmt(t0 + n.t)} min · p ${fmt(n.p, 3)}${n.truth ? "  ★ true" : ""}${late ? "  (after run end)" : ""}`);
    }
    (n.children || []).forEach(k => visit(k, n));
  };
  visit(root, null);
  svg.setAttribute("width", maxX + PAD * 2 + 300);
  svg.setAttribute("height", maxY + PAD * 2 + 40);
}

function side() {
  const S = { rem: cands.map((_, i) => i), done: new Set() }, m = mass(S.rem);
  const order = ranked(S, policy);
  const rows = order.map((c, r) => {
    const P = cands[c].p / m, T = remT(c, S.done);
    return `<tr class="${coversTruth(c) ? "truth" : ""}"><td>${r + 1}. ${cands[c].name}${coversTruth(c) ? " ★" : ""}</td>` +
      `<td class="num">${fmt(P, 3)}</td><td class="num">${fmt(T, 0)}</td><td class="num">${fmt(P / T, 4)}</td></tr>`;
  }).join("");
  const res = Object.keys(POLICY_LABEL).map(p => [p, chain(p)]);
  const best = Math.min(...res.map(([, r]) => r.E));
  const pol = res.map(([p, r]) => `<tr class="${Math.abs(r.E - best) < 1e-9 ? "best" : ""}"><td>${POLICY_LABEL[p]}</td>` +
    `<td class="num">${fmt(r.E)}</td><td class="num">${fmt(r.attempts, 2)}</td><td class="num">${fmt(r.late, 3)}</td>` +
    `<td class="num">${r.truthAt == null ? "–" : fmt(t0 + r.truthAt)}</td></tr>`).join("");
  const seq = (sc.sequence || []).map(name => `<li class="${name === sc.truth ? "ok" : ""}">${name}</li>`).join("");
  document.getElementById("side").innerHTML = `
    <h2>Scenario</h2>
    <p><b>${sc.title}</b><br>True anomaly: <b>${sc.truth ?? "unmapped"}</b>, fixed by ${truthProcs.join(" → ") || "–"}
    ${cands.some((_, c) => coversTruth(c)) ? "" : '<br><span style="color:var(--bad)">No first-decision candidate\'s procedures fix it; in this tree the true fix is never reached.</span>'}<br>
    First decision at ${fmt(t0)} min after injection · run ends ${fmt(sc.horizon_min)} min after injection</p>
    <h2>Candidates at the first decision (ranked by ${POLICY_LABEL[policy]})</h2>
    <table><thead><tr><th>Hypothesis</th><th class="num">P</th><th class="num">T (min)</th><th class="num">P/T</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Policies on this tree</h2>
    <table><thead><tr><th>Policy</th><th class="num">E[T] (min)</th><th class="num">E[#tries]</th><th class="num">P(late)</th><th class="num">True fix at</th></tr></thead><tbody>${pol}</tbody></table>
    <p class="note">E[T]: expected time from the first decision to the fixing procedure's completion under the model probabilities; a miss adds the verification window. P(late): probability the fix lands after the run ends. "True fix at": minutes after injection at which the policy completes the true anomaly's procedures.</p>
    <h2>What the simulation did (P/T policy)</h2>
    <ol class="seq">${seq || "<li>no procedure</li>"}</ol>
    <h2>Model</h2>
    <p class="note">Decision node: choose a remaining hypothesis and work its not-yet-done procedures in series (T = sum of KG ETRs). Chance node: the anomaly is fixed with probability equal to the renormalized mass of every remaining hypothesis whose procedures are now all done. A miss eliminates those hypotheses and leads to the next decision node. E* = minimum expected time to recovery from that node (backward induction); Q = expected time if that branch is taken and play continues optimally. The tree uses the first-decision probabilities with Bayesian elimination; the simulation instead re-reads the evaluation at each decision point, so its later choices can differ.</p>`;
}

function render() {
  memo = new Map();
  const root = build({ rem: cands.map((_, i) => i), done: new Set() }, "r", 0, 1, true);
  layout(root, 0, 0, { n: 0 });
  draw(root);
  side();
}

function load(i) {
  sc = DATA[i]; cands = sc.candidates; etr = sc.etr || {}; toggles = {};
  truthProcs = sc.truth_procedures || [];
  t0 = ((sc.decided_at ?? sc.inject_at) - sc.inject_at) / 60;
  if (document.getElementById("window").value === "") document.getElementById("window").value = sc.verify_window_min ?? 1;
  W = Number(document.getElementById("window").value);
  render();
}

const sel = document.getElementById("scenario");
DATA.forEach((s, i) => {
  const o = document.createElement("option");
  o.value = i; o.disabled = !s.candidates.length;
  o.textContent = `${s.title} — ${s.candidates.length} candidate${s.candidates.length === 1 ? "" : "s"}`;
  sel.appendChild(o);
});
const firstRich = DATA.reduce((b, s, i) => (s.candidates.length > (DATA[b]?.candidates.length ?? -1) ? i : b), 0);
const initial = DATA.findIndex(s => s.number === 24);
sel.value = initial >= 0 && DATA[initial].candidates.length ? initial : firstRich;
sel.onchange = () => load(Number(sel.value));
document.getElementById("policy").onchange = e => { policy = e.target.value; toggles = {}; render(); };
document.getElementById("window").onchange = e => { W = Number(e.target.value) || 0; render(); };
document.getElementById("collapse").onclick = () => { toggles = {}; render(); };
document.getElementById("expand").onclick = () => {
  if (cands.length > 6 && !confirm(`${cands.length} candidates: the full tree has up to ${cands.length}! paths. Expand anyway?`)) return;
  const all = (S, id) => S.rem.forEach(c => { const cid = `${id}/${c}`; toggles[cid] = true; const o = option(S, c); if (o.fail) all(o.fail, cid + "/f"); });
  all({ rem: cands.map((_, i) => i), done: new Set() }, "r");
  render();
};
if (DATA.length) load(Number(sel.value));
</script>
