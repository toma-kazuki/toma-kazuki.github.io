<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LSTM detector schematic</title>
<link rel="stylesheet" href="style.css">
<script src="nav.js?v=10"></script>
</head>
<body>
<div class="stage">
  <section class="slide">
    <header class="head">4. Case Study — LSTM detection</header>
    <h1>Binary AnomalyLSTM: window → recurrent net → nominal / anomaly</h1>
    <svg viewBox="0 0 1152 480" width="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" aria-label="Binary LSTM detector schematic">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#707070"/>
        </marker>
        <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#500000"/>
        </marker>
      </defs>

      <rect x="8" y="4" width="150" height="48" rx="8" fill="#f2f0ea" stroke="#707070" stroke-width="2"/>
      <text x="83" y="24" font-size="14" font-weight="700" text-anchor="middle" fill="#202020">Habitat sim</text>
      <text x="83" y="42" font-size="11" text-anchor="middle" fill="#707070">1 Hz telemetry</text>
      <path d="M158,28 L188,28" stroke="#707070" stroke-width="2" marker-end="url(#arr)"/>

      <rect x="190" y="4" width="200" height="188" rx="10" fill="#fff" stroke="#500000" stroke-width="2.5"/>
      <text x="290" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#500000">Input window</text>
      <text x="290" y="42" font-size="11" text-anchor="middle" fill="#707070">T=60 · F=68 · z-scored</text>
      <g font-size="10" fill="#707070" text-anchor="middle">
        <text x="230" y="64">t−59</text>
        <text x="270" y="64">…</text>
        <text x="310" y="64">t−1</text>
        <text x="350" y="64">t</text>
      </g>
      <g stroke="#500000" stroke-width="1.3">
        <circle cx="230" cy="84" r="7" fill="#f2f0ea"/><circle cx="230" cy="108" r="7" fill="#f2f0ea"/><circle cx="230" cy="132" r="7" fill="#f2f0ea"/>
        <circle cx="270" cy="84" r="7" fill="#f2f0ea"/><circle cx="270" cy="108" r="7" fill="#f2f0ea"/><circle cx="270" cy="132" r="7" fill="#f2f0ea"/>
        <circle cx="310" cy="84" r="7" fill="#f2f0ea"/><circle cx="310" cy="108" r="7" fill="#f2f0ea"/><circle cx="310" cy="132" r="7" fill="#f2f0ea"/>
        <circle cx="350" cy="84" r="7" fill="#d6d3c4"/><circle cx="350" cy="108" r="7" fill="#d6d3c4"/><circle cx="350" cy="132" r="7" fill="#d6d3c4"/>
      </g>
      <text x="290" y="176" font-size="11" text-anchor="middle" fill="#707070">x ∈ ℝ⁶⁸ each second</text>

      <path d="M390,98 L418,98" stroke="#707070" stroke-width="2.5" marker-end="url(#arr)"/>

      <rect x="420" y="4" width="370" height="188" rx="10" fill="#fff" stroke="#500000" stroke-width="2.5"/>
      <text x="605" y="22" font-size="15" font-weight="700" text-anchor="middle" fill="#500000">AnomalyLSTM (unrolled)</text>
      <text x="605" y="38" font-size="11" text-anchor="middle" fill="#707070">same cell · shared weights · H = 32</text>

      <g font-size="10" fill="#707070" text-anchor="middle">
        <text x="470" y="54">xₜ₋₅₉</text>
        <text x="560" y="54">…</text>
        <text x="650" y="54">xₜ₋₁</text>
        <text x="740" y="54">xₜ</text>
      </g>
      <g font-size="11" text-anchor="middle">
        <rect x="438" y="68" width="64" height="44" rx="7" fill="#f2f0ea" stroke="#500000" stroke-width="2"/>
        <text x="470" y="88" font-weight="700" fill="#202020">LSTM</text>
        <text x="470" y="103" fill="#707070">cell</text>
        <text x="560" y="94" font-size="18" fill="#707070">···</text>
        <rect x="618" y="68" width="64" height="44" rx="7" fill="#f2f0ea" stroke="#500000" stroke-width="2"/>
        <text x="650" y="88" font-weight="700" fill="#202020">LSTM</text>
        <text x="650" y="103" fill="#707070">cell</text>
        <rect x="708" y="68" width="64" height="44" rx="7" fill="#d6d3c4" stroke="#500000" stroke-width="2.5"/>
        <text x="740" y="88" font-weight="700" fill="#202020">LSTM</text>
        <text x="740" y="103" fill="#707070">cell</text>
      </g>
      <g font-size="10" text-anchor="middle" fill="#500000">
        <circle cx="470" cy="132" r="11" fill="#fff" stroke="#500000" stroke-width="1.6"/>
        <text x="470" y="135" font-weight="700">h</text>
        <path d="M481,132 L638,132" stroke="#500000" stroke-width="1.8" marker-end="url(#arrd)"/>
        <circle cx="650" cy="132" r="11" fill="#fff" stroke="#500000" stroke-width="1.6"/>
        <text x="650" y="135" font-weight="700">h</text>
        <path d="M661,132 L728,132" stroke="#500000" stroke-width="2" marker-end="url(#arrd)"/>
        <circle cx="740" cy="132" r="12" fill="#d6d3c4" stroke="#500000" stroke-width="2"/>
        <text x="740" y="135" font-weight="700">h</text>
        <text x="740" y="152" font-weight="700">hₜ ∈ ℝ³²</text>
      </g>
      <text x="605" y="172" font-size="11" text-anchor="middle" fill="#707070">each step τ: (h_τ, c_τ) = LSTM(x_τ, h_{τ−1}, c_{τ−1})</text>
      <text x="605" y="186" font-size="11" text-anchor="middle" fill="#500000" font-weight="700">only final h_t → binary head · gates: next slide</text>

      <path d="M790,132 L818,132" stroke="#500000" stroke-width="2.5" marker-end="url(#arrd)"/>

      <rect x="820" y="4" width="324" height="188" rx="10" fill="#fff" stroke="#500000" stroke-width="2.5"/>
      <text x="982" y="22" font-size="15" font-weight="700" text-anchor="middle" fill="#500000">Binary head</text>
      <text x="982" y="38" font-size="11" text-anchor="middle" fill="#707070">two logits → softmax · true detection</text>

      <g stroke="#500000" stroke-width="1.2">
        <circle cx="860" cy="78" r="6" fill="#d6d3c4"/>
        <circle cx="860" cy="100" r="6" fill="#d6d3c4"/>
        <text x="860" y="122" font-size="12" text-anchor="middle" fill="#707070">⋮</text>
        <circle cx="860" cy="140" r="6" fill="#d6d3c4"/>
      </g>
      <text x="860" y="160" font-size="10" text-anchor="middle" fill="#500000" font-weight="700">hₜ (32)</text>

      <g stroke="#9e9e9e" stroke-width="0.9" fill="none" opacity="0.9">
        <line x1="866" y1="78" x2="944" y2="78"/>
        <line x1="866" y1="78" x2="944" y2="118"/>
        <line x1="866" y1="100" x2="944" y2="78"/>
        <line x1="866" y1="100" x2="944" y2="118"/>
        <line x1="866" y1="140" x2="944" y2="78"/>
        <line x1="866" y1="140" x2="944" y2="118"/>
      </g>

      <g stroke="#500000" stroke-width="1.4" font-size="13" fill="#202020">
        <circle cx="952" cy="78" r="9" fill="#fff"/><text x="970" y="83">z₀  nominal</text>
        <circle cx="952" cy="118" r="9" fill="#fff"/><text x="970" y="123">z₁  anomaly</text>
      </g>

      <rect x="888" y="150" width="242" height="34" rx="4" fill="#f2f0ea" stroke="#707070" stroke-width="1"/>
      <text x="1009" y="164" font-size="11" text-anchor="middle" fill="#202020">
        <tspan font-weight="700">P = softmax(z)</tspan>
        <tspan fill="#707070">  ·  2 classes</tspan>
      </text>
      <text x="1009" y="178" font-size="11" text-anchor="middle" fill="#500000" font-weight="700">if P(anomaly) ≥ 0.5 → observation</text>

      <rect x="16" y="210" width="1120" height="250" rx="10" fill="#f2f0ea" stroke="#707070" stroke-width="1.5"/>
      <text x="576" y="236" font-size="15" font-weight="700" text-anchor="middle" fill="#500000">In the habitat-dx loop</text>

      <g font-size="14" font-weight="700" text-anchor="middle" fill="#202020">
        <rect x="48" y="256" width="170" height="54" rx="8" fill="#fff" stroke="#500000" stroke-width="2.5"/>
        <text x="133" y="278">Detection</text>
        <text x="133" y="296" font-size="11" font-weight="400" fill="#707070">lstm-binary</text>

        <rect x="278" y="256" width="170" height="54" rx="8" fill="#fff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="363" y="278" fill="#707070">Hypothesis</text>
        <text x="363" y="296" font-size="11" font-weight="400" fill="#9e9e9e">gated / off in open loop</text>

        <rect x="508" y="256" width="170" height="54" rx="8" fill="#fff" stroke="#500000" stroke-width="2.5"/>
        <text x="593" y="278">Evaluation</text>
        <text x="593" y="296" font-size="11" font-weight="400" fill="#707070">P(nom), P(anom)</text>

        <rect x="738" y="256" width="150" height="54" rx="8" fill="#fff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="813" y="278" fill="#707070">Decision</text>
        <text x="813" y="296" font-size="11" font-weight="400" fill="#9e9e9e">not in Study C open</text>

        <rect x="948" y="256" width="150" height="54" rx="8" fill="#fff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="1023" y="278" fill="#707070">Execute</text>
        <text x="1023" y="296" font-size="11" font-weight="400" fill="#9e9e9e">disabled</text>
      </g>
      <g stroke="#707070" stroke-width="2" marker-end="url(#arr)">
        <line x1="218" y1="283" x2="274" y2="283"/>
        <line x1="448" y1="283" x2="504" y2="283"/>
        <line x1="678" y1="283" x2="734" y2="283"/>
        <line x1="888" y1="283" x2="944" y2="283"/>
      </g>

      <path d="M133,310 L133,360 L593,360 L593,314" fill="none" stroke="#500000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrd)"/>
      <text x="360" y="382" font-size="13" text-anchor="middle" fill="#500000">Detection publishes binary scores each tick</text>
      <text x="360" y="402" font-size="12" text-anchor="middle" fill="#707070">anomaly observation gates diagnosis when hyp / eval are enabled</text>
      <text x="940" y="380" font-size="12" text-anchor="middle" fill="#707070">solid = active in open-loop Study C</text>
      <text x="940" y="400" font-size="12" text-anchor="middle" fill="#707070">dashed = disabled / gated</text>
    </svg>
    <div class="footer"><span>habitat-dx · multi-agent AFDDR simulation</span><span data-page></span></div>
  </section>
</div>
</body>
</html>
